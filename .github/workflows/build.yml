name: Build and package DATE_EXTRA plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: date-extra
      plugin_directory: date_extra
      build_target: date_extra
      plugin_library: date_extra.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: date_extra
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
